name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,engineering-lab-a,phase2-lab]"
      - run: pytest
      - name: Check learner-facing JavaScript syntax
        run: find lessons projects labs tests/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Test learner-facing interaction behavior
        run: node --test tests/js/*.test.js
      - run: make labs
      - name: Verify generated curriculum is current
        run: |
          python tools/build_lessons.py
          git diff --exit-code
