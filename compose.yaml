name: learn-ai

services:
  course-ui:
    image: nginx:1.27-alpine
    profiles: ["foundations"]
    ports:
      - "8080:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
    depends_on:
      foundations-api:
        condition: service_healthy

  foundations-api:
    build:
      context: ./labs/foundations
    profiles: ["foundations"]
    environment:
      FOUNDATIONS_DB_PATH: /data/experiments.db
      FOUNDATIONS_PORT: "8080"
    ports:
      - "8081:8080"
    volumes:
      - foundations-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

volumes:
  foundations-data:
